<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The site icon: the same leaf-from-an-open-hand glyph the header and footer
    draw, on the brand navy so it reads as a mark rather than a smudge at 16px.

    It is its own file, not a reference to `BrandGlyph`, because a favicon is
    fetched by the browser before any React runs. Keeping the two in step is a
    manual job — which is why the path data below is copied verbatim.
  -->
