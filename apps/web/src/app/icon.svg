  <g transform="translate(16 16) scale(0.72) translate(-16 -16)">
    <path d="M16 27c-5.5 0-10-4-10-9 0-6.5 5-12 10-15 5 3 10 8.5 10 15 0 5-4.5 9-10 9Z" fill="#F1F8FF" opacity="0.22"/>
    <path d="M16 26V11" stroke="#F1F8FF" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M16 17c0-3.2 2.4-5.9 5.6-6.4C21.3 14 19 16.6 16 17Zm0 0c0-3.2-2.4-5.9-5.6-6.4C10.7 14 13 16.6 16 17Z" fill="#F1F8FF"/>
  </g>
</svg>
