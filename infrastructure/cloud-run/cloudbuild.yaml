# Cloud Build: BUILD AND PUSH the three images (Phase 14). It does NOT deploy —
# deploying is a separate, human, approved step (DEPLOYMENT.md §12).
#
#   gcloud builds submit --config infrastructure/cloud-run/cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_IMAGE_TAG=<tag>,_SITE_URL=https://<site>,_MEDIA_PUBLIC_BASE_URL=https://<media host> .
#
# Run from the repository root. Nothing secret is passed: the web build needs
# only the three public build arguments, and no API or database.
substitutions:
  _REGION: asia-south1
  _REPOSITORY: sailent
  _IMAGE_TAG: manual
  _SITE_URL: ''
  _MEDIA_PUBLIC_BASE_URL: ''
options:
  machineType: E2_HIGHCPU_8
steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api:${_IMAGE_TAG}
      - .
  - id: worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/worker/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/worker:${_IMAGE_TAG}
      - .
  - id: web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - APP_ENV=production
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_SITE_URL}
      - --build-arg
      - MEDIA_PUBLIC_BASE_URL=${_MEDIA_PUBLIC_BASE_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:${_IMAGE_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/worker:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:${_IMAGE_TAG}
timeout: 2400s
