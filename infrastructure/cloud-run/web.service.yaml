# Cloud Run service: sailent-web (Phase 14). A TEMPLATE — nothing here deploys.
#
#   gcloud run services replace web.service.yaml --region "$REGION"   (by hand, approved)
#
# The image is built for ONE environment: APP_ENV, NEXT_PUBLIC_APP_URL and
# MEDIA_PUBLIC_BASE_URL are build arguments (apps/web/Dockerfile). Everything
# below is read at runtime.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sailent-web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # One warm instance: a donor's first page should not wait for a cold start.
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/startup-cpu-boost: 'true'
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: sailent-web@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/sailent/web:${IMAGE_TAG}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          env:
            - name: APP_ENV
              value: production
            - name: NODE_ENV
              value: production
            - name: API_URL
              value: ${API_URL}
            - name: NEXT_PUBLIC_APP_URL
              value: ${SITE_URL}
            - name: FEATURE_MOCK_DATA
              value: 'false'
            # Behind Cloudflare use cf-connecting-ip; without it, x-forwarded-for
            # with one trusted hop (Google's front end). DEPLOYMENT.md §6a.
            - name: CLIENT_IP_HEADER
              value: ${CLIENT_IP_HEADER}
            - name: TRUSTED_PROXY_HOPS
              value: '1'
            - name: SENTRY_ENVIRONMENT
              value: production
            - name: SENTRY_RELEASE
              value: ${IMAGE_TAG}
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: sailent-internal-api-secret
                  key: latest
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: sailent-sentry-dsn
                  key: latest
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
