# Cloud Run service: sailent-worker (Phase 14). A TEMPLATE — nothing here deploys.
#
#   gcloud run services replace worker.service.yaml --region "$REGION"   (by hand, approved)
#
# The worker consumes queues and runs the reconciliation schedule, which is
# work done OUTSIDE any request. So:
#   - CPU ALWAYS ALLOCATED (cpu-throttling: false) — otherwise Cloud Run starves
#     it of CPU between requests and jobs stall;
#   - exactly ONE instance (min = max = 1) — the schedule is single-registered
#     anyway, but one consumer keeps email sending predictable;
#   - INTERNAL ingress and no public invoker: it serves only /health and /ready.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sailent-worker
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/startup-cpu-boost: 'true'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/network-interfaces: '[{"network":"${VPC_NETWORK}","subnetwork":"${VPC_SUBNET}"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: sailent-worker@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 10
      timeoutSeconds: 30
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/sailent/worker:${IMAGE_TAG}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: APP_ENV
              value: production
            - name: NODE_ENV
              value: production
            - name: APP_PUBLIC_URL
              value: ${SITE_URL}
            - name: API_INTERNAL_URL
              value: ${API_URL}
            - name: WORKER_CONCURRENCY
              value: '5'
            - name: PAYMENT_RECONCILE_INTERVAL_MS
              value: '600000'
            - name: BREVO_SENDER_EMAIL
              value: ${BREVO_SENDER_EMAIL}
            - name: BREVO_SENDER_NAME
              value: Sailent Foundation
            - name: SENTRY_ENVIRONMENT
              value: production
            - name: SENTRY_RELEASE
              value: ${IMAGE_TAG}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sailent-database-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sailent-redis-url
                  key: latest
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: sailent-internal-api-secret
                  key: latest
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sailent-brevo-api-key
                  key: latest
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: sailent-sentry-dsn
                  key: latest
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
